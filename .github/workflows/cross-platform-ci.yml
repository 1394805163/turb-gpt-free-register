name: Cross-platform Python 3.12 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q core config webui tests

      - name: Run platform-independent regression tests
        run: >-
          python -m unittest
          tests.test_platform_compat
          tests.test_pipeline_concurrency
          tests.test_icloud_mail_pool
          tests.test_icloud_otp_retry
          tests.test_icloud_pool_management
          tests.test_webui_auth
          -v
